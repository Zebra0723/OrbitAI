name: Refresh content

on:
  schedule:
    # Daily at 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install RSS parser
        run: npm install --no-save rss-parser@3

      - name: Fetch feeds
        run: node scripts/refresh-content.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "vortex-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/content.json
          if git diff --staged --quiet; then
            echo "No content changes."
          else
            git commit -m "chore: refresh content $(date -u +%Y-%m-%d)"
            git push
          fi
