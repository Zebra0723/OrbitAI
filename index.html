<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vortex</title>
<style>
  :root {
    /* Palette: warm cream surfaces, near-black ink, three accents */
    --bg:        #f4f0e8;
    --surface:   #ffffff;
    --ink:       #15161d;
    --muted:     #6b6b78;
    --line:      #e6e0d2;
    --line-soft: #efeadd;
    --coral:     #f04e45;
    --cobalt:    #1f3bff;
    --saffron:   #e8a317;
    --shadow:    0 6px 24px rgba(20, 16, 8, 0.06);
    --shadow-lg: 0 16px 40px rgba(20, 16, 8, 0.10);
    --radius:    18px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .hidden { display: none !important; }
  button { font-family: inherit; }

  /* ── Lock screen ──────────────────────────────────────────────── */
  #lock {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    background: var(--bg);
    overflow: hidden;
  }
  #lock::before, #lock::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
  }
  #lock::before { background: var(--coral);  width: 380px; height: 380px; top: -120px; left: -100px; }
  #lock::after  { background: var(--cobalt); width: 420px; height: 420px; bottom: -160px; right: -120px; }
  .lock-card {
    position: relative;
    background: var(--surface);
    padding: 44px 36px 32px;
    border-radius: 22px;
    width: min(380px, 90vw);
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--line);
  }
  .lock-mark {
    width: 44px; height: 44px;
    margin-bottom: 22px;
  }
  .lock-card h1 {
    margin: 0 0 4px;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .lock-card .lock-sub {
    color: var(--muted); margin: 0 0 24px; font-size: 14px;
  }
  .lock-card input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .lock-card input:focus { border-color: var(--cobalt); background: white; }
  .lock-card button[type="submit"] {
    margin-top: 12px;
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: none;
    background: var(--ink);
    color: white;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
  }
  .lock-card button[type="submit"]:hover { opacity: 0.88; }
  .lock-card button[type="submit"]:active { transform: translateY(1px); }
  .lock-error { color: var(--coral); margin-top: 10px; font-size: 13px; min-height: 18px; }

  /* ── App shell ────────────────────────────────────────────────── */
  #app {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
  }

  /* Sidebar */
  aside.sidebar {
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 22px 14px;
    position: sticky; top: 0; align-self: start;
    height: 100vh;
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 0 8px 22px;
    cursor: pointer;
    user-select: none;
  }
  .brand-mark { width: 28px; height: 28px; flex: none; }
  .brand-name {
    font-size: 18px; font-weight: 800; letter-spacing: 0.02em;
  }
  .nav-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    padding: 14px 10px 6px;
    font-weight: 600;
  }
  .nav-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 9px 10px;
    background: transparent;
    border: none;
    color: var(--ink);
    text-align: left;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s;
  }
  .nav-btn:hover { background: var(--line-soft); }
  .nav-btn.active {
    background: var(--ink);
    color: white;
  }
  .nav-btn .nav-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .nav-btn.coral   .nav-dot { background: var(--coral); }
  .nav-btn.cobalt  .nav-dot { background: var(--cobalt); }
  .nav-btn.saffron .nav-dot { background: var(--saffron); }
  .nav-btn.active .nav-dot { background: rgba(255,255,255,0.85); }
  .nav-divider { height: 1px; background: var(--line); margin: 12px 6px; border: 0; }
  .sidebar-foot { margin-top: auto; padding-top: 16px; }

  /* Topbar */
  .main-wrap { min-width: 0; }
  header.topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 32px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky; top: 0; z-index: 5;
  }
  .menu-toggle {
    display: none;
    background: transparent;
    border: 1px solid var(--line);
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink);
  }
  .crumb {
    display: flex; align-items: baseline; gap: 12px;
    flex: 1; min-width: 0;
  }
  .crumb h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .crumb .crumb-sub { color: var(--muted); font-size: 13px; }
  .updated {
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  main#main { padding: 28px 32px 80px; max-width: 1180px; }

  /* ── Dashboard ────────────────────────────────────────────────── */
  .hero {
    margin-bottom: 28px;
  }
  .hero h1 {
    margin: 0 0 6px;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .hero p {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
  }

  .grid-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0;
    text-align: left;
    cursor: pointer;
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    font-family: inherit;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: #d8d1bf;
  }
  .card-art {
    height: 110px;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .card-art svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .card-meta {
    padding: 14px 16px 16px;
  }
  .card-eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .card h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }

  /* Section page */
  .section-tabs {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    gap: 2px;
    margin-bottom: 22px;
  }
  .tab-btn {
    background: transparent;
    border: none;
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    transition: background 0.12s, color 0.12s;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active {
    background: var(--ink);
    color: white;
  }
  .tab-count {
    margin-left: 6px;
    background: rgba(255,255,255,0.18);
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .tab-btn:not(.active) .tab-count {
    background: var(--line-soft);
    color: var(--muted);
  }

  .items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .item {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 18px 14px;
    display: flex; flex-direction: column;
    position: relative;
    transition: transform 0.12s, box-shadow 0.15s, border-color 0.15s;
  }
  .item:hover { box-shadow: var(--shadow); border-color: #d8d1bf; }
  .item.starred {
    border-color: var(--saffron);
    box-shadow: 0 0 0 1px var(--saffron) inset;
  }
  .item-stripe {
    position: absolute; top: 0; left: 18px; right: 18px; height: 3px;
    border-radius: 0 0 3px 3px;
  }
  .item-stripe.coral   { background: var(--coral); }
  .item-stripe.cobalt  { background: var(--cobalt); }
  .item-stripe.saffron { background: var(--saffron); }
  .item-tag {
    display: inline-flex; align-items: center;
    align-self: flex-start;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 10px;
    margin-top: 6px;
  }
  .item h4 {
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }
  .item p {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.55;
    flex: 1;
  }
  .item-foot {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--line-soft);
    padding-top: 10px;
    gap: 8px;
  }
  .item-link {
    color: var(--cobalt);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
  }
  .item-link:hover { text-decoration: underline; }
  .item-date { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .vote-row { display: flex; gap: 4px; }
  .vote-btn {
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .vote-btn:hover { background: var(--line-soft); color: var(--ink); }
  .vote-btn svg { width: 14px; height: 14px; }
  .vote-btn.active.up      { background: #e7faef; border-color: #88d6a4; color: #1d7a47; }
  .vote-btn.active.down    { background: #fde8e7; border-color: #f0a7a3; color: #b03a35; }
  .vote-btn.active.save    { background: #fff5dd; border-color: #f1c869; color: #8c6010; }

  .empty {
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

  /* Starred view */
  .starred-group {
    margin-bottom: 28px;
  }
  .starred-group h3 {
    margin: 0 0 12px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .starred-group h3 .pill {
    background: var(--line-soft);
    color: var(--ink);
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: 0.06em;
  }

  /* ── Reminders ────────────────────────────────────────────────── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
  }
  .reminder-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .reminder-form input[type="text"] {
    flex: 2 1 220px;
    padding: 11px 13px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .reminder-form input[type="date"] {
    flex: 1 1 140px;
    padding: 11px 13px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .reminder-form input:focus { border-color: var(--cobalt); background: white; }
  .reminder-form button {
    padding: 11px 20px;
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  .reminder-form button:hover { opacity: 0.88; }
  .reminder-list { list-style: none; padding: 0; margin: 0; }
  .reminder-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .reminder-item.done { opacity: 0.6; }
  .reminder-item.done .reminder-text { text-decoration: line-through; }
  .reminder-item input[type="checkbox"] {
    width: 18px; height: 18px;
    accent-color: var(--ink);
    cursor: pointer;
  }
  .reminder-text { flex: 1; font-size: 14px; }
  .reminder-date {
    font-size: 11px;
    color: var(--muted);
    background: var(--surface);
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: 600;
    border: 1px solid var(--line);
  }
  .reminder-date.overdue { color: var(--coral); border-color: #f0a7a3; background: #fde8e7; }
  .reminder-delete {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; font-size: 18px; line-height: 1; padding: 4px 8px;
  }
  .reminder-delete:hover { color: var(--coral); }

  /* ── Studio ──────────────────────────────────────────────────── */
  .studio-tools {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .studio-tools button {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  .studio-tools button:hover { background: var(--line-soft); }
  .studio-editor {
    width: 100%;
    min-height: 460px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px 28px;
    font-size: 16px;
    line-height: 1.7;
    background: var(--surface);
    outline: none;
    font-family: "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
    color: var(--ink);
  }
  .studio-editor:focus { border-color: var(--cobalt); }
  .studio-editor p { margin: 0 0 0.85em; text-indent: 1.5em; }
  .studio-editor p:first-child { text-indent: 0; }
  .studio-hint { margin-top: 10px; font-size: 12px; color: var(--muted); }

  /* ── Responsive ──────────────────────────────────────────────── */
  @media (max-width: 820px) {
    #app { grid-template-columns: 1fr; }
    aside.sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 260px; z-index: 50;
      transform: translateX(-100%);
      transition: transform 0.2s;
    }
    aside.sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
    .menu-toggle { display: inline-flex; }
    .scrim {
      position: fixed; inset: 0; background: rgba(20,16,8,0.4);
      z-index: 40; opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .scrim.show { opacity: 1; pointer-events: auto; }
    main#main { padding: 22px 18px 60px; }
    header.topbar { padding: 14px 18px; }
  }
</style>
</head>
<body>

<!-- ── Lock screen ─────────────────────────────────────────────── -->
<div id="lock">
  <div class="lock-card">
    <svg class="lock-mark" viewBox="0 0 44 44" fill="none">
      <circle cx="22" cy="22" r="20" stroke="#15161d" stroke-width="2"/>
      <circle cx="22" cy="22" r="12" stroke="#f04e45" stroke-width="2"/>
      <circle cx="22" cy="22" r="4" fill="#1f3bff"/>
    </svg>
    <h1>Vortex</h1>
    <p class="lock-sub">Enter your password to continue.</p>
    <form id="lock-form">
      <input id="lock-input" type="password" placeholder="Password" autocomplete="off" autofocus />
      <button type="submit">Unlock</button>
      <div class="lock-error" id="lock-error"></div>
    </form>
  </div>
</div>

<!-- ── App ─────────────────────────────────────────────────────── -->
<div id="app" class="hidden">
  <div class="scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand" id="brand">
      <svg class="brand-mark" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="13" stroke="#15161d" stroke-width="1.6"/>
        <circle cx="14" cy="14" r="7"  stroke="#f04e45" stroke-width="1.6"/>
        <circle cx="14" cy="14" r="2.2" fill="#1f3bff"/>
      </svg>
      <span class="brand-name">VORTEX</span>
    </div>

    <nav id="nav"></nav>

    <div class="sidebar-foot">
      <button class="nav-btn" id="logout-btn">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="10" height="7" rx="1.5"/>
          <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>
        </svg>
        Lock
      </button>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <button class="menu-toggle" id="menu-toggle" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M3 5h12M3 9h12M3 13h12"/>
        </svg>
      </button>
      <div class="crumb">
        <h2 id="crumb-title">Dashboard</h2>
        <span class="crumb-sub" id="crumb-sub"></span>
      </div>
      <div class="updated" id="updated"></div>
    </header>

    <main id="main"></main>
  </div>
</div>

<script>
"use strict";

const PASSWORD = "vortex123";
const SESSION_KEY  = "vortex_unlocked";
const REMINDERS_KEY = "vortex_reminders";
const JOY_KEY      = "vortex_joy_draft";
const VOTES_KEY    = "vortex_votes";

/* Section catalogue ------------------------------------------------ */

const SECTIONS = [
  { key: "tennis",   label: "Tennis",      desc: "ATP/WTA stories, tactics, comebacks.",            color: "coral",   art: "arc"     },
  { key: "books",    label: "Books",       desc: "Biographies, big thinkers, new releases.",        color: "coral",   art: "spines"  },
  { key: "rabbit",   label: "Curiosity",   desc: "Science, history, design, strange facts.",        color: "coral",   art: "spiral"  },
  { key: "author",   label: "Author",      desc: "Writing craft, interviews, inspiration.",         color: "cobalt",  art: "lines"   },
  { key: "engineer", label: "Engineering", desc: "Kits, projects, robotics, makers.",               color: "cobalt",  art: "gear"    },
  { key: "radar",    label: "Releases",    desc: "LEGO, tech, gadgets, cubing, tools.",             color: "cobalt",  art: "bars"    },
  { key: "prestige", label: "Prestige",    desc: "Writing contests, prizes, magazines.",            color: "saffron", art: "pyramid" },
];

const SECTION_BY_KEY = Object.fromEntries(SECTIONS.map(s => [s.key, s]));

/* ── Abstract SVG illustrations (one per section) ─────────────── */

function artSVG(kind, colorVar) {
  const c = `var(--${colorVar})`;
  switch (kind) {
    case "arc": return `
      <svg viewBox="0 0 280 110" preserveAspectRatio="xMidYMid slice">
        <circle cx="80" cy="140" r="80" fill="none" stroke="${c}" stroke-width="2" opacity="0.85"/>
        <circle cx="80" cy="140" r="55" fill="none" stroke="${c}" stroke-width="2" opacity="0.55"/>
        <circle cx="80" cy="140" r="30" fill="none" stroke="${c}" stroke-width="2" opacity="0.35"/>
        <circle cx="220" cy="38" r="6" fill="${c}"/>
      </svg>`;
    case "spines": return `
      <svg viewBox="0 0 280 110" preserveAspectRatio="xMidYMid slice">
        <rect x="40"  y="22" width="14" height="74" rx="2" fill="${c}" opacity="0.85"/>
        <rect x="62"  y="34" width="14" height="62" rx="2" fill="${c}" opacity="0.55"/>
        <rect x="84"  y="14" width="14" height="82" rx="2" fill="${c}" opacity="0.35"/>
        <rect x="106" y="42" width="14" height="54" rx="2" fill="${c}" opacity="0.7"/>
        <circle cx="220" cy="55" r="22" fill="none" stroke="${c}" stroke-width="2"/>
      </svg>`;
    case "spiral": return `
      <svg viewBox="0 0 280 110" preserveAspectRatio="xMidYMid slice">
        <path d="M140,55 m-30,0 a30,30 0 1,1 60,0 a22,22 0 1,1 -44,0 a14,14 0 1,1 28,0 a6,6 0 1,1 -12,0"

        <circle cx="40" cy="20" r="4" fill="${c}"/>
        <circle cx="240" cy="90" r="4" fill="${c}"/>
      </svg>`;
    case "lines": return `
      <svg viewBox="0 0 280 110" preserveAspectRatio="xMidYMid slice">
        <line x1="50"  y1="20" x2="50"  y2="90" stroke="${c}" stroke-width="2"/>
        <line x1="70"  y1="30" x2="70"  y2="80" stroke="${c}" stroke-width="2" opacity="0.7"/>

      <svg viewBox="0 0 280 110" preserveAspectRatio="xMidYMid slice">

          <circle r="32" fill="none" stroke="${c}" stroke-width="2"/>
          <circle r="14" fill="none" stroke="${c}" stroke-width="2"/>
          ${Array.from({length:8}).map((_,i)=>{
            const a=i*45*Math.PI/180; const x1=Math.cos(a)*32, y1=Math.sin(a)*32, x2=Math.cos(a)*40, y2=Math.sin(a)*40;
            return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width="2"/>`;
          }).join('')}
        </g>
        <rect x="170" y="40" width="60" height="6" fill="${c}" opacity="0.7"/>
        <rect x="170" y="56" width="40" height="6" fill="${c}" opacity="0.45"/>
      </svg>`;
    case "bars": return `
      <svg viewBox="0 0 280 110" preserveAspectRatio="xMidYMid slice">
        <rect x="40"  y="70" width="16" height="26" fill="${c}" opacity="0.45"/>
        <rect x="64"  y="56" width="16" height="40" fill="${c}" opacity="0.65"/>
        <rect x="88"  y="38" width="16" height="58" fill="${c}" opacity="0.85"/>
        <rect x="112" y="20" width="16" height="76" fill="${c}"/>
        <circle cx="210" cy="40" r="22" fill="none" stroke="${c}" stroke-width="2"/>
        <line x1="200" y1="30" x2="220" y2="50" stroke="${c}" stroke-width="2"/>

    case "pyramid": return `
      <svg viewBox="0 0 280 110" preserveAspectRatio="xMidYMid slice">
        <polygon points="100,90 60,90 80,40" fill="none" stroke="${c}" stroke-width="2"/>
        <polygon points="140,90 100,90 120,30" fill="none" stroke="${c}" stroke-width="2"/>
        <polygon points="180,90 140,90 160,55" fill="none" stroke="${c}" stroke-width="2"/>
        <circle cx="220" cy="55" r="14" fill="${c}"/>
        <circle cx="240" cy="35" r="6" fill="${c}" opacity="0.6"/>
      </svg>`;
    case "dots": return `
      <svg viewBox="0 0 280 110" preserveAspectRatio="xMidYMid slice">
        ${Array.from({length:6}).map((_,r)=>Array.from({length:14}).map((_,c)=>{
          const x=20+c*18, y=14+r*16;
          const op = 0.18 + ((r+c)%5)*0.16;
          return `<circle cx="${x}" cy="${y}" r="2.4" fill="${`var(--${colorVar})`}" opacity="${op.toFixed(2)}"/>`;
        }).join('')).join('')}
      </svg>`;
    case "circles": return `
      <svg viewBox="0 0 280 110" preserveAspectRatio="xMidYMid slice">
        <circle cx="80"  cy="55" r="40" fill="none" stroke="${c}" stroke-width="2"/>
        <circle cx="80"  cy="55" r="26" fill="none" stroke="${c}" stroke-width="2" opacity="0.65"/>
        <circle cx="80"  cy="55" r="12" fill="${c}"/>
        <line x1="140" y1="55" x2="240" y2="55" stroke="${c}" stroke-width="2" opacity="0.6"/>
      </svg>`;
  }
  return "";
}

/* ── Content loading ──────────────────────────────────────────── */

let CONTENT = null;
let LAST_UPDATED = null;

async function loadContent() {
  try {
    const res = await fetch("data/content.json?v=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    CONTENT = json;
    LAST_UPDATED = json._lastUpdated || null;
    updateLastUpdated();
  } catch (err) {
    console.error("Couldn't load content.json:", err);
    CONTENT = {};
    updateLastUpdated();
  }
}
function updateLastUpdated() {
  if (!LAST_UPDATED) {
    updatedEl.textContent = "Seed content";
    return;
  }
  const d = new Date(LAST_UPDATED);
  const now = new Date();
  const diffH = (now - d) / 36e5;
  let label;
  if (diffH < 1) label = "Updated " + Math.max(1, Math.round(diffH * 60)) + "m ago";
  else if (diffH < 24) label = "Updated " + Math.round(diffH) + "h ago";
  else label = "Updated " + d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  updatedEl.textContent = label;
}

/* ── Votes & ranking ──────────────────────────────────────────── */

function loadVotes() {
  try { return JSON.parse(localStorage.getItem(VOTES_KEY) || "{}"); }
  catch { return {}; }
}
function saveVotes(v) { localStorage.setItem(VOTES_KEY, JSON.stringify(v)); }

function tagAffinity(sectionKey) {
  // Returns { tagName: score } for items in this section based on current votes
  const votes = loadVotes();
  const items = (CONTENT && CONTENT[sectionKey]) || [];
  const aff = {};
  for (const it of items) {
    const v = votes[it.id];
    if (!v) continue;
    const w = v === "up" ? 1 : v === "down" ? -2 : v === "save" ? 3 : 0;
    aff[it.tag] = (aff[it.tag] || 0) + w;
  }
  return aff;
}

function rankItems(sectionKey, items) {
  const votes = loadVotes();
  const aff = tagAffinity(sectionKey);
  const decorated = items.map((it, idx) => {
    const v = votes[it.id];
    const tagScore = aff[it.tag] || 0;
    const isSave = v === "save";
    const ts = it.published ? Date.parse(it.published) : 0;
    return { it, idx, isSave, tagScore, ts, isDown: v === "down" };
  });
  decorated.sort((a, b) => {
    if (a.isSave !== b.isSave) return a.isSave ? -1 : 1;
    if (a.tagScore !== b.tagScore) return b.tagScore - a.tagScore;
    if (a.ts !== b.ts) return b.ts - a.ts;
    return a.idx - b.idx;
  });
  // Push hard-downvoted items to the very end
  const positives = decorated.filter(x => !x.isDown);
  const negatives = decorated.filter(x => x.isDown);
  return [...positives, ...negatives].map(x => x.it);
}

function starredItemsBySection() {
  const votes = loadVotes();
  const out = {};
  for (const s of SECTIONS) {
    const items = ((CONTENT && CONTENT[s.key]) || []).filter(it => votes[it.id] === "save");
    if (items.length) out[s.key] = items;
  }
  return out;
}

/* ── Routing ──────────────────────────────────────────────────── */

let currentView = "home";
let currentTab = "all"; // section view tab

function navigate(view) {
  currentView = view;
  currentTab = "all";
  setNavActive(view);
  sidebar.classList.remove("open");
  scrim.classList.remove("show");

  if (view === "home") return renderHome();
  if (view === "starred") return renderStarred();
  if (view === "studio") return renderStudio();
  if (view === "reminders") return renderReminders();
  if (view.startsWith("section:")) return renderSection(view.slice(8));
  renderHome();
}

/* ── Render: Section ──────────────────────────────────────────── */

function renderSection(key) {
  const s = SECTION_BY_KEY[key];
  if (!s) return renderHome();
  crumbT.textContent = s.label;
  crumbS.textContent = s.desc;

  const items = (CONTENT && CONTENT[key]) || [];
  const votes = loadVotes();
  const starredCount = items.filter(it => votes[it.id] === "save").length;

  const tabs = document.createElement("div");
  tabs.className = "section-tabs";
  tabs.innerHTML = `
    <button class="tab-btn ${currentTab === 'all' ? 'active' : ''}" data-tab="all">All <span class="tab-count">${items.length}</span></button>
    <button class="tab-btn ${currentTab === 'starred' ? 'active' : ''}" data-tab="starred">Starred <span class="tab-count">${starredCount}</span></button>
  `;
  tabs.querySelectorAll(".tab-btn").forEach(b => {
    b.addEventListener("click", () => {
      currentTab = b.dataset.tab;
      renderSection(key);
    });
  });

  const list = document.createElement("div");
  let visible = items;
  if (currentTab === "starred") visible = items.filter(it => votes[it.id] === "save");
  else visible = rankItems(key, items);

  if (visible.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = currentTab === "starred"
      ? `<strong>No starred items yet</strong>Tap the star on any card in this section to save it here.`
      : `<strong>Nothing here yet</strong>Content will appear once the daily refresh runs.`;
    list.appendChild(empty);
  } else {
    const grid = document.createElement("div");
    grid.className = "items";
    for (const it of visible) grid.appendChild(makeItem(it, s));
    list.appendChild(grid);
  }

  main.replaceChildren(tabs, list);
}

function makeItem(it, s) {
  const votes = loadVotes();
  const v = votes[it.id];
  const card = document.createElement("article");
  card.className = "item" + (v === "save" ? " starred" : "");

  const dateStr = it.published ? formatPublishedDate(it.published) : "";
  const linkHtml = it.link
    ? `<a class="item-link" href="${escapeAttr(it.link)}" target="_blank" rel="noopener noreferrer">Read source</a>`
    : `<span class="item-date">${escapeHtml(dateStr)}</span>`;
  const dateInFoot = it.link && dateStr ? `<span class="item-date">${escapeHtml(dateStr)}</span>` : "";

  card.innerHTML = `
    <div class="item-stripe ${s.color}"></div>
    <span class="item-tag">${escapeHtml(it.tag || "")}</span>
    <h4>${escapeHtml(it.title)}</h4>
    <p>${escapeHtml(it.body)}</p>
    <div class="item-foot">
      <div>${linkHtml}${dateInFoot ? ' &middot; ' + dateInFoot : ''}</div>
      <div class="vote-row">
        <button class="vote-btn up   ${v === 'up'   ? 'active' : ''}" data-vote="up"   title="More like this">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>
        </button>
        <button class="vote-btn down ${v === 'down' ? 'active' : ''}" data-vote="down" title="Less like this">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
        <button class="vote-btn save ${v === 'save' ? 'active' : ''}" data-vote="save" title="Save">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><polygon points="8,2 10,6.2 14.5,6.7 11.2,9.7 12.1,14.2 8,12 3.9,14.2 4.8,9.7 1.5,6.7 6,6.2"/></svg>
        </button>
      </div>
    </div>
  `;
  card.querySelectorAll(".vote-btn").forEach(b => {
    b.addEventListener("click", () => {
      const action = b.dataset.vote;
      const all = loadVotes();
      all[it.id] = all[it.id] === action ? null : action;
      if (!all[it.id]) delete all[it.id];
      saveVotes(all);
      // Re-render the section so ranking + starred state update
      if (currentView.startsWith("section:")) renderSection(currentView.slice(8));
      else if (currentView === "starred") renderStarred();
    });
  });
  return card;
}

function formatPublishedDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const now = new Date();
  const diffH = (now - d) / 36e5;
  if (diffH < 1) return Math.max(1, Math.round(diffH * 60)) + "m ago";
  if (diffH < 24) return Math.round(diffH) + "h ago";
  if (diffH < 24 * 7) return Math.round(diffH / 24) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

/* ── Render: Starred (global) ─────────────────────────────────── */

function renderStarred() {
  crumbT.textContent = "Starred";
  crumbS.textContent = "Your saved items, grouped by section.";
  const groups = starredItemsBySection();
  const wrap = document.createElement("div");

  const totalCount = Object.values(groups).reduce((n, arr) => n + arr.length, 0);
  if (totalCount === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `<strong>Nothing saved yet</strong>Tap the star on any card to save it. Saved items show up here.`;
    wrap.appendChild(empty);
    main.replaceChildren(wrap);
    return;
  }

  for (const s of SECTIONS) {
    const items = groups[s.key];
    if (!items || !items.length) continue;
    const group = document.createElement("section");
    group.className = "starred-group";
    const h = document.createElement("h3");
    h.innerHTML = `${escapeHtml(s.label)} <span class="pill">${items.length}</span>`;
    group.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "items";
    for (const it of items) grid.appendChild(makeItem(it, s));
    group.appendChild(grid);
    wrap.appendChild(group);
  }
  main.replaceChildren(wrap);
}

/* ── Render: Reminders ────────────────────────────────────────── */

function loadReminders() {
  try { return JSON.parse(localStorage.getItem(REMINDERS_KEY) || "[]"); }
  catch { return []; }
}
function saveReminders(arr) { localStorage.setItem(REMINDERS_KEY, JSON.stringify(arr)); }

function renderReminders() {
  crumbT.textContent = "Reminders";
  crumbS.textContent = "Things to remember.";

  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `
    <form class="reminder-form" id="reminder-form">
      <input type="text" id="reminder-input" placeholder="Add a reminder…" required />
      <input type="date" id="reminder-date-input" />
      <button type="submit">Add</button>
    </form>
    <ul class="reminder-list" id="reminder-list"></ul>
    <div class="empty hidden" id="reminder-empty"><strong>No reminders yet.</strong>Add one above.</div>
  `;
  main.replaceChildren(panel);

  const form = document.getElementById("reminder-form");
  const input = document.getElementById("reminder-input");
  const dateIn = document.getElementById("reminder-date-input");
  const list = document.getElementById("reminder-list");
  const empty = document.getElementById("reminder-empty");

  function isOverdue(iso) {
    if (!iso) return false;
    const today = new Date(); today.setHours(0,0,0,0);
    return new Date(iso + "T00:00:00") < today;
  }
  function fmtDate(iso) {
    if (!iso) return "";
    return new Date(iso + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function render() {
    const all = loadReminders();
    list.innerHTML = "";
    if (!all.length) { empty.classList.remove("hidden"); return; }
    empty.classList.add("hidden");
    all.sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (a.date && b.date) return a.date.localeCompare(b.date);
      if (a.date) return -1;
      if (b.date) return 1;
      return b.created - a.created;
    });
    for (const r of all) {
      const li = document.createElement("li");
      li.className = "reminder-item" + (r.done ? " done" : "");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = r.done;
      cb.addEventListener("change", () => {
        const cur = loadReminders();
        const t = cur.find(x => x.id === r.id);
        if (t) { t.done = cb.checked; saveReminders(cur); render(); }
      });
      const text = document.createElement("div");
      text.className = "reminder-text"; text.textContent = r.text;
      li.appendChild(cb); li.appendChild(text);
      if (r.date) {
        const d = document.createElement("span");
        d.className = "reminder-date" + (!r.done && isOverdue(r.date) ? " overdue" : "");
        d.textContent = fmtDate(r.date);
        li.appendChild(d);
      }
      const del = document.createElement("button");
      del.className = "reminder-delete"; del.textContent = "×"; del.title = "Delete";
      del.addEventListener("click", () => {
        saveReminders(loadReminders().filter(x => x.id !== r.id));
        render();
      });
      li.appendChild(del);
      list.appendChild(li);
    }
  }
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const t = input.value.trim();
    if (!t) return;
    const all = loadReminders();
    all.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), text: t, date: dateIn.value || null, done: false, created: Date.now() });
    saveReminders(all);
    input.value = ""; dateIn.value = "";
    render(); input.focus();
  });
  render();
}

/* ── Render: Studio ───────────────────────────────────────────── */

function renderStudio() {
  crumbT.textContent = "Studio";
  crumbS.textContent = "Write. Auto-saves to this browser.";

  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `
    <div class="studio-tools">
      <button type="button" data-cmd="bold"><b>B</b></button>
      <button type="button" data-cmd="italic"><i>I</i></button>
      <button type="button" data-cmd="newchapter">+ Chapter</button>
      <button type="button" id="studio-clear">Clear</button>
    </div>
    <div class="studio-editor" id="studio-editor" contenteditable="true"></div>
    <p class="studio-hint">Auto-saves to your browser as you type.</p>
  `;
  main.replaceChildren(panel);

  const editor = document.getElementById("studio-editor");
  const saved = localStorage.getItem(JOY_KEY);
  editor.innerHTML = saved || "<p><em>Chapter 1</em></p><p>Start writing here…</p>";
  editor.addEventListener("input", () => localStorage.setItem(JOY_KEY, editor.innerHTML));
  panel.querySelectorAll(".studio-tools button[data-cmd]").forEach(b => {
    b.addEventListener("click", () => {
      const cmd = b.dataset.cmd;
      if (cmd === "bold") document.execCommand("bold");
      else if (cmd === "italic") document.execCommand("italic");
      else if (cmd === "newchapter") {
        const n = (editor.innerHTML.match(/Chapter \d+/g) || []).length + 1;
        document.execCommand("insertHTML", false, `<p><em>Chapter ${n}</em></p><p>&nbsp;</p>`);
      }
      editor.focus();
    });
  });
  document.getElementById("studio-clear").addEventListener("click", () => {
    if (confirm("Clear the whole draft? This can't be undone.")) {
      editor.innerHTML = "<p><em>Chapter 1</em></p><p>Start writing here…</p>";
      localStorage.setItem(JOY_KEY, editor.innerHTML);
    }
  });
}

/* ── Helpers ──────────────────────────────────────────────────── */

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

buildNav();
</script>
</body>
</html>
