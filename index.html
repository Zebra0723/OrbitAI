<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vortex</title>
<style>
  :root {
    --bg:        #fafaf7;
    --surface:   #ffffff;
    --ink:       #15161d;
    --ink-soft:  #3a3a44;
    --muted:     #71717a;
    --line:      #e7e5dd;
    --line-soft: #f1efe8;
    --accent:    #2647ff;
    --accent-soft: #eef0ff;
    --warn:      #c9591a;
    --good:      #1d7a47;
    --save:      #b07d10;
    --shadow-sm: 0 1px 2px rgba(20, 16, 8, 0.04);
    --shadow:    0 8px 28px rgba(20, 16, 8, 0.08);
    --shadow-lg: 0 24px 60px rgba(20, 16, 8, 0.18);
    --radius:    14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font-family: inherit; cursor: pointer; }
  .hidden { display: none !important; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── Lock screen ─────────────────────────────────────────────── */
  #lock {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
  }
  .lock-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 32px 28px;
    width: min(360px, 90vw);
    box-shadow: var(--shadow);
  }
  .lock-mark { width: 36px; height: 36px; margin-bottom: 22px; display: block; }
  .lock-card h1 { margin: 0 0 4px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .lock-card .lock-sub { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
  .lock-card input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink);
    font-size: 15px; outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .lock-card input:focus { border-color: var(--accent); background: white; }
  .lock-card button[type="submit"] {
    margin-top: 10px; width: 100%; padding: 12px 14px;
    border: none; border-radius: 10px;
    background: var(--ink); color: white;
    font-weight: 600; font-size: 15px;
  }
  .lock-card button[type="submit"]:hover { opacity: 0.88; }
  .lock-error { color: var(--warn); margin-top: 10px; font-size: 13px; min-height: 18px; }

  /* ── Topbar ──────────────────────────────────────────────────── */
  header.topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky; top: 0; z-index: 30;
  }
  .icon-btn {
    background: transparent; border: 1px solid transparent;
    width: 36px; height: 36px;
    border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink);
    transition: background 0.12s, border-color 0.12s;
  }
  .icon-btn:hover { background: var(--line-soft); }
  .icon-btn svg { width: 18px; height: 18px; }
  .brand {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
  }
  .brand svg { width: 22px; height: 22px; }
  .brand span { font-size: 14px; font-weight: 700; letter-spacing: 0.06em; }
  .topbar-spacer { flex: 1; }
  .topbar-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ── Drawer ──────────────────────────────────────────────────── */
  .scrim {
    position: fixed; inset: 0; background: rgba(20,16,8,0.34);
    z-index: 80; opacity: 0; pointer-events: none;
    transition: opacity 0.18s;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: 280px; background: var(--surface);
    border-right: 1px solid var(--line);
    z-index: 90;
    transform: translateX(-100%);
    transition: transform 0.22s cubic-bezier(.4,.0,.2,1);
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-lg);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .drawer-head .brand { padding: 0; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 12px 10px; }
  .drawer-foot { padding: 12px 10px; border-top: 1px solid var(--line); }
  .nav-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); font-weight: 600;
    padding: 14px 10px 6px;
  }
  .nav-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 9px 10px;
    background: transparent; border: none;
    color: var(--ink); text-align: left;
    border-radius: 8px;
    font-size: 14px; font-weight: 500;
    transition: background 0.12s;
  }
  .nav-btn:hover { background: var(--line-soft); }
  .nav-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.45; flex: none; }
  .nav-divider { height: 1px; background: var(--line); margin: 10px 6px; border: 0; }

  /* ── Main ────────────────────────────────────────────────────── */
  main#main { padding: 28px 22px 80px; max-width: 880px; margin: 0 auto; }
  .page-head { margin-bottom: 26px; }
  .page-head h1 { margin: 0 0 4px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .page-head p { margin: 0; color: var(--muted); font-size: 14.5px; }

  /* ── Dashboard cards ─────────────────────────────────────────── */
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }
  .nav-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 16px 14px;
    text-align: left;
    transition: border-color 0.12s, background 0.12s;
  }
  .nav-card:hover { border-color: #cfccc1; background: var(--surface); }
  .nav-card .nav-card-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .nav-card .mark {
    width: 8px; height: 8px; border-radius: 50%; background: var(--ink); flex: none;
  }
  .nav-card.workspace .mark { background: var(--accent); }
  .nav-card.discover .mark  { background: var(--ink); opacity: 0.5; }
  .nav-card.library  .mark  { background: var(--save); }
  .nav-card h3 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .nav-card p  { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }

  .group-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); font-weight: 600; margin: 24px 0 10px;
  }

  /* ── Section items ───────────────────────────────────────────── */
  .section-tabs {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    margin-bottom: 22px;
  }
  .tab-btn {
    background: transparent; border: none;
    padding: 7px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { background: var(--ink); color: white; }
  .tab-count {
    margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 11px;
    background: var(--line-soft); color: var(--muted);
  }
  .tab-btn.active .tab-count { background: rgba(255,255,255,0.18); color: white; }

  .items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .item {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 16px 12px;
    display: flex; flex-direction: column;
    transition: border-color 0.12s;
  }
  .item:hover { border-color: #cfccc1; }
  .item.starred { border-color: var(--save); box-shadow: 0 0 0 1px var(--save) inset; }
  .item-tag {
    font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); margin-bottom: 6px;
  }
  .item h4 { margin: 0 0 6px; font-size: 15px; font-weight: 700; line-height: 1.35; letter-spacing: -0.01em; }
  .item p { margin: 0 0 12px; color: var(--ink-soft); font-size: 13px; line-height: 1.55; flex: 1; }
  .item-foot {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--line-soft); padding-top: 8px; gap: 8px;
  }
  .item-link { font-size: 12px; font-weight: 600; }
  .item-date { color: var(--muted); font-size: 12px; }
  .vote-row { display: flex; gap: 4px; }
  .vote-btn {
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    color: var(--muted);
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .vote-btn:hover { background: var(--line-soft); color: var(--ink); }
  .vote-btn svg { width: 13px; height: 13px; }
  .vote-btn.active.up   { background: #e7faef; border-color: #88d6a4; color: var(--good); }
  .vote-btn.active.down { background: #fde8e7; border-color: #f0a7a3; color: var(--warn); }
  .vote-btn.active.save { background: #fff5dd; border-color: #f1c869; color: var(--save); }

  .empty {
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; font-weight: 700; }

  .starred-group { margin-bottom: 24px; }
  .starred-group h3 {
    margin: 0 0 10px;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .starred-group h3 .pill {
    background: var(--line-soft); color: var(--ink);
    padding: 1px 8px; border-radius: 999px;
    font-size: 11px; letter-spacing: 0.06em;
  }

  /* ── Reminders ───────────────────────────────────────────────── */
  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px;
  }
  .reminder-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .reminder-form input[type="text"] { flex: 2 1 220px; }
  .reminder-form input[type="date"] { flex: 1 1 140px; }
  .reminder-form input {
    padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink); font-size: 14px; outline: none;
    font-family: inherit;
  }
  .reminder-form input:focus { border-color: var(--accent); background: white; }
  .reminder-form button {
    padding: 10px 18px; background: var(--ink); color: white;
    border: none; border-radius: 10px; font-weight: 600; font-size: 14px;
  }
  .reminder-form button:hover { opacity: 0.88; }
  .reminder-list { list-style: none; padding: 0; margin: 0; }
  .reminder-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px;
  }
  .reminder-item.done { opacity: 0.55; }
  .reminder-item.done .reminder-text { text-decoration: line-through; }
  .reminder-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--ink); }
  .reminder-text { flex: 1; font-size: 14px; }
  .reminder-date {
    font-size: 11px; color: var(--muted); background: var(--surface);
    padding: 3px 9px; border-radius: 999px; font-weight: 600;
    border: 1px solid var(--line);
  }
  .reminder-date.overdue { color: var(--warn); border-color: #f0a7a3; background: #fde8e7; }
  .reminder-delete { background: transparent; border: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 8px; }
  .reminder-delete:hover { color: var(--warn); }

  /* ── Studio: library ─────────────────────────────────────────── */
  .lib-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
  .btn-primary {
    background: var(--ink); color: white; border: none;
    padding: 9px 14px; border-radius: 9px;
    font-weight: 600; font-size: 13.5px;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary svg { width: 14px; height: 14px; }
  .btn-secondary {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); padding: 9px 14px; border-radius: 9px;
    font-weight: 600; font-size: 13.5px;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .btn-secondary:hover { background: var(--line-soft); }
  .btn-ghost {
    background: transparent; color: var(--muted);
    border: none; padding: 6px 10px; border-radius: 8px;
    font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-ghost:hover { background: var(--line-soft); color: var(--ink); }
  .btn-ghost svg { width: 14px; height: 14px; }

  .book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }
  .book-card { background: transparent; border: none; padding: 0; text-align: left; }
  .book-cover-thumb {
    width: 100%; aspect-ratio: 2 / 3;
    border-radius: 8px;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 14px;
    color: white;
    box-shadow: var(--shadow);
    transition: transform 0.15s, box-shadow 0.15s;
    overflow: hidden;
    position: relative;
  }
  .book-card:hover .book-cover-thumb { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .book-cover-thumb .cv-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; word-break: break-word; }
  .book-cover-thumb .cv-author { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
  .book-card .book-meta { padding: 10px 2px 0; }
  .book-card .book-meta .bm-title { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .book-card .book-meta .bm-sub { font-size: 12px; color: var(--muted); margin: 2px 0 0; }

  /* ── Studio: editor (book workspace) ─────────────────────────── */
  .studio-view {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    z-index: 60;          /* above the main topbar */
  }
  .studio-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .studio-bar .sb-title { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; }
  .studio-bar .sb-spacer { flex: 1; }
  .studio-bar .sb-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .studio-body {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: 280px 1fr;
  }
  .studio-body.outline-collapsed { grid-template-columns: 0 1fr; }
  .studio-body.outline-collapsed .outline { display: none; }

  .outline {
    background: var(--surface);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 10px 8px 24px;
  }
  .outline-group-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); font-weight: 600;
    padding: 14px 10px 4px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .outline-group-label .add-mini {
    background: transparent; border: 1px solid var(--line);
    border-radius: 6px; padding: 0 6px; height: 22px;
    color: var(--muted); font-size: 12px; line-height: 1; cursor: pointer;
  }
  .outline-group-label .add-mini:hover { background: var(--line-soft); color: var(--ink); }
  .outline-row {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 8px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--ink-soft);
    position: relative;
  }
  .outline-row:hover { background: var(--line-soft); }
  .outline-row.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .outline-row .or-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .outline-row .or-words { font-size: 11px; color: var(--muted); margin-right: 4px; font-variant-numeric: tabular-nums; }
  .outline-row .or-actions {
    display: none; gap: 2px;
  }
  .outline-row:hover .or-actions { display: inline-flex; }
  .outline-row .or-actions button {
    background: transparent; border: none; color: var(--muted);
    padding: 2px 4px; border-radius: 4px; line-height: 1;
  }
  .outline-row .or-actions button:hover { background: var(--bg); color: var(--ink); }
  .outline-row .or-actions svg { width: 12px; height: 12px; }
  .outline-row .or-rename-input {
    flex: 1;
    background: var(--surface); border: 1px solid var(--accent);
    border-radius: 6px; padding: 3px 6px; font-size: 13.5px; outline: none; color: var(--ink);
    font-family: inherit;
  }

  .editor-pane {
    overflow-y: auto;
    padding: 28px 16px 80px;
    background: var(--bg);
  }
  .editor-shell {
    max-width: 720px; margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 36px 36px;
    box-shadow: var(--shadow-sm);
  }
  .editor-eyebrow {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em;
    color: var(--muted); font-weight: 600; margin: 0 0 6px;
  }
  .editor-heading {
    font-size: 26px; font-weight: 700; letter-spacing: -0.015em;
    margin: 0 0 22px;
    background: transparent; border: none; padding: 0; outline: none;
    width: 100%; color: var(--ink);
    font-family: inherit;
  }
  .editor-toolbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--surface);
    border-bottom: 1px solid var(--line-soft);
    padding: 6px 0 8px; margin: -8px 0 14px;
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .editor-toolbar button {
    background: transparent; border: 1px solid transparent;
    padding: 5px 9px; border-radius: 6px;
    font-size: 13px; color: var(--ink-soft); font-weight: 600;
  }
  .editor-toolbar button:hover { background: var(--line-soft); color: var(--ink); }
  .editor-toolbar .sep { width: 1px; background: var(--line); margin: 4px 4px; }
  .editor-content {
    min-height: 360px;
    font-family: "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
    font-size: 17px; line-height: 1.7; color: var(--ink);
    outline: none;
  }
  .editor-content p  { margin: 0 0 0.85em; text-indent: 1.5em; }
  .editor-content p:first-child { text-indent: 0; }
  .editor-content h2 {
    text-indent: 0;
    text-align: center; font-weight: 600; letter-spacing: 0.04em;
    margin: 1.6em 0 1em; font-size: 1em;
    text-transform: uppercase;
  }
  .editor-content blockquote {
    margin: 0 0 0.85em 1.5em; padding: 0 0 0 14px;
    border-left: 2px solid var(--line);
    color: var(--ink-soft); font-style: italic;
  }
  .editor-content hr {
    border: 0; height: 1px; background: var(--line);
    margin: 2em auto; width: 80px;
  }
  .editor-empty {
    color: var(--muted); font-style: italic;
    pointer-events: none;
  }

  /* Cover editor */
  .cover-editor { display: grid; grid-template-columns: minmax(180px, 240px) 1fr; gap: 28px; align-items: start; }
  .cover-preview {
    aspect-ratio: 2 / 3; border-radius: 10px;
    box-shadow: var(--shadow);
    color: white;
    padding: 22px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .cover-preview .cp-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
  .cover-preview .cp-author { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.9; }
  .cover-form .field { display: block; margin-bottom: 14px; }
  .cover-form label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; }
  .cover-form input[type="text"] {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 9px;
    background: var(--bg); color: var(--ink); font-size: 14px; outline: none; font-family: inherit;
  }
  .cover-form input:focus { border-color: var(--accent); background: white; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .swatch.selected { border-color: var(--ink); }

</style>

<script>
"use strict";

const PASSWORD       = "vortex123";
const SESSION_KEY    = "vortex_unlocked";
const REMINDERS_KEY  = "vortex_reminders";
const VOTES_KEY      = "vortex_votes";
const STUDIO_KEY     = "vortex_studio";
const LEGACY_JOY_KEY = "vortex_joy_draft";

/* ── Section catalogue ────────────────────────────────────────── */

const SECTIONS = [
  { key: "tennis",   label: "Tennis",      desc: "ATP/WTA stories, tactics, comebacks." },
  { key: "books",    label: "Books",       desc: "Biographies, big thinkers, new releases." },
  { key: "rabbit",   label: "Curiosity",   desc: "Science, history, design, strange facts." },
  { key: "author",   label: "Author",      desc: "Writing craft, interviews, inspiration." },
  { key: "engineer", label: "Engineering", desc: "Kits, projects, robotics, makers." },
  { key: "radar",    label: "Releases",    desc: "LEGO, tech, gadgets, cubing, tools." },
  { key: "prestige", label: "Prestige",    desc: "Writing contests, prizes, magazines." },
];
const SECTION_BY_KEY = Object.fromEntries(SECTIONS.map(s => [s.key, s]));

/* ── Cover gradient palette ──────────────────────────────────── */

const COVER_PALETTE = [
  { id: "cobalt",  bg: "linear-gradient(160deg, #1f3bff 0%, #4a5ee8 100%)" },
  { id: "coral",   bg: "linear-gradient(160deg, #f04e45 0%, #e85a78 100%)" },
  { id: "saffron", bg: "linear-gradient(160deg, #e8a317 0%, #f5c14e 100%)" },
  { id: "olive",   bg: "linear-gradient(160deg, #4a7c2a 0%, #7ba84d 100%)" },
  { id: "plum",    bg: "linear-gradient(160deg, #6b3d8c 0%, #9b6cb8 100%)" },
  { id: "slate",   bg: "linear-gradient(160deg, #1a1a1f 0%, #4a4a55 100%)" },
  { id: "rose",    bg: "linear-gradient(160deg, #d04f78 0%, #e879a3 100%)" },
];
const coverGradient = (id) => (COVER_PALETTE.find(p => p.id === id) || COVER_PALETTE[0]).bg;

/* ── Studio data model ───────────────────────────────────────── */

const SECTION_TYPES = {
  cover:           { label: "Cover",            group: "front", emoji: null },
  "title-page":    { label: "Title Page",       group: "front" },
  copyright:       { label: "Copyright",        group: "front" },
  dedication:      { label: "Dedication",       group: "front" },
  foreword:        { label: "Foreword",         group: "front" },
  preface:         { label: "Preface",          group: "front" },
  prologue:        { label: "Prologue",         group: "front" },
  chapter:         { label: "Chapter",          group: "body"  },
  part:            { label: "Part",             group: "body"  },
  custom:          { label: "Section",          group: "body"  },
  epilogue:        { label: "Epilogue",         group: "back"  },
  acknowledgments: { label: "Acknowledgments",  group: "back"  },
  "about-author":  { label: "About the Author", group: "back"  },
};
const FRONT_OPTIONAL = ["foreword", "preface", "prologue", "dedication", "copyright"];
const BACK_OPTIONAL  = ["epilogue", "acknowledgments", "about-author"];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function loadStudio() {
  let s;
  try { s = JSON.parse(localStorage.getItem(STUDIO_KEY) || "null"); } catch { s = null; }
  if (!s || !s.books) {
    s = { books: {}, activeBookId: null };
    // Migrate legacy single draft if present
    const legacy = localStorage.getItem(LEGACY_JOY_KEY);
    if (legacy && legacy.trim()) {
      const book = newBook("Finding Joy", "Arjun");
      // Pull legacy HTML into Chapter 1
      const ch = book.sections.find(x => x.type === "chapter");
      if (ch) ch.content = legacy;
      s.books[book.id] = book;
      s.activeBookId = book.id;
    } else {
      const book = newBook("Finding Joy", "Arjun");
      s.books[book.id] = book;
      s.activeBookId = book.id;
    }
    localStorage.setItem(STUDIO_KEY, JSON.stringify(s));
  }
  return s;
}
function saveStudio(s) { localStorage.setItem(STUDIO_KEY, JSON.stringify(s)); }

function newBook(title, author) {
  const id = uid();
  const now = Date.now();
  const sections = [
    { id: uid(), type: "cover",      title: "Cover",      content: "" },
    { id: uid(), type: "title-page", title: "Title Page", content: "" },
    { id: uid(), type: "chapter",    title: "Chapter 1",  content: "" },
  ];
  return {
    id, title, author,
    cover: { color: "cobalt" },
    sections,
    activeSectionId: sections[2].id,
    createdAt: now, updatedAt: now,
  };
}
function bookWordCount(book) {
  return book.sections.reduce((n, s) => n + sectionWordCount(s), 0);
}
function sectionWordCount(s) {
  if (!s.content) return 0;
  const text = s.content.replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").trim();
  if (!text) return 0;
  return text.split(/\s+/).length;
}

/* ── DOM refs ─────────────────────────────────────────────────── */

const lockEl     = document.getElementById("lock");
const appEl      = document.getElementById("app");
const lockForm   = document.getElementById("lock-form");
const lockInput  = document.getElementById("lock-input");
const lockError  = document.getElementById("lock-error");
const drawer     = document.getElementById("drawer");
const drawerNav  = document.getElementById("drawer-nav");
const drawerClose = document.getElementById("drawer-close");
const scrim      = document.getElementById("scrim");
const menuToggle = document.getElementById("menu-toggle");
const logoutBtn  = document.getElementById("logout-btn");
const brand      = document.getElementById("brand");
const main       = document.getElementById("main");
const studioMount = document.getElementById("studio-mount");
const updatedEl  = document.getElementById("updated");

/* ── Lock ─────────────────────────────────────────────────────── */

function unlock() {
  lockEl.classList.add("hidden");
  appEl.classList.remove("hidden");
  navigate("home");
  loadContent().then(() => {
    if (currentView !== "home") navigate(currentView);
    else updateLastUpdated();
  });
}
function relock() {
  closeStudio();
  sessionStorage.removeItem(SESSION_KEY);
  appEl.classList.add("hidden");
  lockEl.classList.remove("hidden");
  lockInput.value = "";
  lockInput.focus();
}
if (sessionStorage.getItem(SESSION_KEY) === "1") unlock();

lockForm.addEventListener("submit", (e) => {
  e.preventDefault();
  if (lockInput.value === PASSWORD) {
    sessionStorage.setItem(SESSION_KEY, "1");
    lockError.textContent = "";
    unlock();
  } else {
    lockError.textContent = "Wrong password.";
    lockInput.value = "";
    lockInput.focus();
  }
});
logoutBtn.addEventListener("click", relock);
brand.addEventListener("click", () => navigate("home"));

/* ── Drawer ───────────────────────────────────────────────────── */

function openDrawer()  { drawer.classList.add("open");  scrim.classList.add("show");  drawer.setAttribute("aria-hidden","false"); }
function closeDrawer() { drawer.classList.remove("open"); scrim.classList.remove("show"); drawer.setAttribute("aria-hidden","true"); }
menuToggle.addEventListener("click", openDrawer);
drawerClose.addEventListener("click", closeDrawer);
scrim.addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

function buildDrawerNav() {
  drawerNav.innerHTML = "";
  drawerNav.appendChild(navBtn("home", "Dashboard"));
  drawerNav.appendChild(navBtn("studio", "Studio"));
  drawerNav.appendChild(navBtn("reminders", "Reminders"));
  drawerNav.appendChild(navBtn("starred", "Starred"));
  const sep = document.createElement("hr"); sep.className = "nav-divider"; drawerNav.appendChild(sep);
  const lab = document.createElement("div"); lab.className = "nav-label"; lab.textContent = "Discover"; drawerNav.appendChild(lab);
  for (const s of SECTIONS) drawerNav.appendChild(navBtn("section:" + s.key, s.label));
}
function navBtn(view, label) {
  const b = document.createElement("button");
  b.className = "nav-btn";
  b.dataset.view = view;
  b.innerHTML = `<span class="nav-dot"></span>${escapeHtml(label)}`;
  b.addEventListener("click", () => { navigate(view); closeDrawer(); });
  return b;
}
function setNavActive(view) {
  document.querySelectorAll(".nav-btn[data-view]").forEach(b => {
    b.classList.toggle("active", b.dataset.view === view);
  });
}
buildDrawerNav();

/* ── Content (RSS) loading ───────────────────────────────────── */

let CONTENT = null;
let LAST_UPDATED = null;

async function loadContent() {
  try {
    const res = await fetch("data/content.json?v=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    CONTENT = json;
    LAST_UPDATED = json._lastUpdated || null;
    updateLastUpdated();
  } catch (err) {
    console.error("Couldn't load content.json:", err);
    CONTENT = {};
    updateLastUpdated();
  }
}
function updateLastUpdated() {
  if (!LAST_UPDATED) { updatedEl.textContent = ""; return; }
  const d = new Date(LAST_UPDATED);
  const diffH = (Date.now() - d.getTime()) / 36e5;
  let label;
  if (diffH < 1) label = "Updated " + Math.max(1, Math.round(diffH * 60)) + "m ago";
  else if (diffH < 24) label = "Updated " + Math.round(diffH) + "h ago";
  else label = "Updated " + d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  updatedEl.textContent = label;
}

/* ── Votes & ranking ──────────────────────────────────────────── */

function loadVotes() { try { return JSON.parse(localStorage.getItem(VOTES_KEY) || "{}"); } catch { return {}; } }
function saveVotes(v) { localStorage.setItem(VOTES_KEY, JSON.stringify(v)); }

function tagAffinity(sectionKey) {
  const votes = loadVotes();
  const items = (CONTENT && CONTENT[sectionKey]) || [];
  const aff = {};
  for (const it of items) {
    const v = votes[it.id]; if (!v) continue;
    const w = v === "up" ? 1 : v === "down" ? -2 : v === "save" ? 3 : 0;
    aff[it.tag] = (aff[it.tag] || 0) + w;
  }
  return aff;
}
function rankItems(sectionKey, items) {
  const votes = loadVotes();
  const aff = tagAffinity(sectionKey);
  const dec = items.map((it, idx) => {
    const v = votes[it.id];
    return {
      it, idx,
      isSave: v === "save",
      isDown: v === "down",
      tagScore: aff[it.tag] || 0,
      ts: it.published ? Date.parse(it.published) : 0,
    };
  });
  dec.sort((a, b) => {
    if (a.isSave !== b.isSave) return a.isSave ? -1 : 1;
    if (a.tagScore !== b.tagScore) return b.tagScore - a.tagScore;
    if (a.ts !== b.ts) return b.ts - a.ts;
    return a.idx - b.idx;
  });
  const pos = dec.filter(x => !x.isDown);
  const neg = dec.filter(x => x.isDown);
  return [...pos, ...neg].map(x => x.it);
}
function starredBySection() {
  const votes = loadVotes();
  const out = {};
  for (const s of SECTIONS) {
    const items = ((CONTENT && CONTENT[s.key]) || []).filter(it => votes[it.id] === "save");
    if (items.length) out[s.key] = items;
  }
  return out;
}

/* ── Routing ──────────────────────────────────────────────────── */

let currentView = "home";
let currentTab  = "all";

function navigate(view) {
  closeStudio();             // tear down studio editor if active
  currentView = view;
  currentTab  = "all";
  setNavActive(view);
  document.title = "Vortex";
  if (view === "home")           return renderHome();
  if (view === "starred")        return renderStarred();
  if (view === "studio")         return renderStudioLibrary();
  if (view === "reminders")      return renderReminders();
  if (view.startsWith("section:")) return renderSection(view.slice(8));
  renderHome();
}

/* ── Dashboard ────────────────────────────────────────────────── */

function renderHome() {
  const head = pageHead("Hey Arjun", "Pick what to dive into.");

  const work = document.createElement("div"); work.className = "nav-grid";
  work.appendChild(navCard("Studio",     "Write your books. Multiple drafts, autosave.",        "workspace", () => navigate("studio")));
  work.appendChild(navCard("Reminders",  "Things to remember. Mark them done.",                  "workspace", () => navigate("reminders")));
  work.appendChild(navCard("Starred",    "Items you've saved across sections.",                  "library",   () => navigate("starred")));

  const lab = document.createElement("div"); lab.className = "group-label"; lab.textContent = "Discover";

  const disc = document.createElement("div"); disc.className = "nav-grid";
  for (const s of SECTIONS) disc.appendChild(navCard(s.label, s.desc, "discover", () => navigate("section:" + s.key)));

  main.replaceChildren(head, work, lab, disc);
}
function navCard(title, desc, kind, onClick) {
  const b = document.createElement("button");
  b.className = "nav-card " + kind;
  b.innerHTML = `
    <div class="nav-card-row"><span class="mark"></span><h3>${escapeHtml(title)}</h3></div>
    <p>${escapeHtml(desc)}</p>
  `;
  b.addEventListener("click", onClick);
  return b;
}
function pageHead(title, sub) {
  const h = document.createElement("div"); h.className = "page-head";
  h.innerHTML = `<h1>${escapeHtml(title)}</h1><p>${escapeHtml(sub)}</p>`;
  return h;
}

/* ── Section view ─────────────────────────────────────────────── */

function renderSection(key) {
  const s = SECTION_BY_KEY[key]; if (!s) return renderHome();
  const items = (CONTENT && CONTENT[key]) || [];
  const votes = loadVotes();
  const starredCount = items.filter(it => votes[it.id] === "save").length;

  const head = pageHead(s.label, s.desc);

  const tabs = document.createElement("div"); tabs.className = "section-tabs";
  tabs.innerHTML = `
    <button class="tab-btn ${currentTab === 'all' ? 'active' : ''}" data-tab="all">All <span class="tab-count">${items.length}</span></button>
    <button class="tab-btn ${currentTab === 'starred' ? 'active' : ''}" data-tab="starred">Starred <span class="tab-count">${starredCount}</span></button>
  `;
  tabs.querySelectorAll(".tab-btn").forEach(b => b.addEventListener("click", () => {
    currentTab = b.dataset.tab; renderSection(key);
  }));

  const list = document.createElement("div");
  let visible = currentTab === "starred"
    ? items.filter(it => votes[it.id] === "save")
    : rankItems(key, items);

  if (!visible.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = currentTab === "starred"
      ? `<strong>No starred items yet</strong>Tap the star on any card to save it.`
      : `<strong>Nothing here yet</strong>Content will appear once the daily refresh runs.`;
    list.appendChild(e);
  } else {
    const grid = document.createElement("div"); grid.className = "items";
    for (const it of visible) grid.appendChild(makeItem(it));
    list.appendChild(grid);
  }
  main.replaceChildren(head, tabs, list);
}

function makeItem(it) {
  const votes = loadVotes(); const v = votes[it.id];
  const card = document.createElement("article");
  card.className = "item" + (v === "save" ? " starred" : "");
  const dateStr = it.published ? formatPublishedDate(it.published) : "";
  const linkHtml = it.link
    ? `<a class="item-link" href="${escapeAttr(it.link)}" target="_blank" rel="noopener noreferrer">Read source</a>`
    : `<span class="item-date">${escapeHtml(dateStr)}</span>`;
  const dateInFoot = it.link && dateStr ? `<span class="item-date">${escapeHtml(dateStr)}</span>` : "";

  card.innerHTML = `
    <div class="item-tag">${escapeHtml(it.tag || "")}</div>
    <h4>${escapeHtml(it.title)}</h4>
    <p>${escapeHtml(it.body)}</p>
    <div class="item-foot">
      <div>${linkHtml}${dateInFoot ? ' &middot; ' + dateInFoot : ''}</div>
      <div class="vote-row">
        <button class="vote-btn up   ${v === 'up'   ? 'active' : ''}" data-vote="up"   title="More like this">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>
        </button>
        <button class="vote-btn down ${v === 'down' ? 'active' : ''}" data-vote="down" title="Less like this">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
        <button class="vote-btn save ${v === 'save' ? 'active' : ''}" data-vote="save" title="Save">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><polygon points="8,2 10,6.2 14.5,6.7 11.2,9.7 12.1,14.2 8,12 3.9,14.2 4.8,9.7 1.5,6.7 6,6.2"/></svg>
        </button>
      </div>
    </div>
  `;
  card.querySelectorAll(".vote-btn").forEach(b => {
    b.addEventListener("click", () => {
      const action = b.dataset.vote;
      const all = loadVotes();
      if (all[it.id] === action) delete all[it.id]; else all[it.id] = action;
      saveVotes(all);
      if (currentView.startsWith("section:")) renderSection(currentView.slice(8));
      else if (currentView === "starred") renderStarred();
    });
  });
  return card;
}
function formatPublishedDate(iso) {
  const d = new Date(iso); if (isNaN(d)) return "";
  const diffH = (Date.now() - d.getTime()) / 36e5;
  if (diffH < 1) return Math.max(1, Math.round(diffH * 60)) + "m ago";
  if (diffH < 24) return Math.round(diffH) + "h ago";
  if (diffH < 24 * 7) return Math.round(diffH / 24) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

/* ── Starred ──────────────────────────────────────────────────── */

function renderStarred() {
  const head = pageHead("Starred", "Your saved items, grouped by section.");
  const groups = starredBySection();
  const wrap = document.createElement("div");
  const total = Object.values(groups).reduce((n, a) => n + a.length, 0);
  if (!total) {
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = `<strong>Nothing saved yet</strong>Tap the star on any card to save it.`;
    wrap.appendChild(e);
  } else {
    for (const s of SECTIONS) {
      const items = groups[s.key]; if (!items?.length) continue;
      const g = document.createElement("section"); g.className = "starred-group";
      const h = document.createElement("h3");
      h.innerHTML = `${escapeHtml(s.label)} <span class="pill">${items.length}</span>`;
      g.appendChild(h);
      const grid = document.createElement("div"); grid.className = "items";
      for (const it of items) grid.appendChild(makeItem(it));
      g.appendChild(grid);
      wrap.appendChild(g);
    }
  }
  main.replaceChildren(head, wrap);
}

/* ── Reminders ────────────────────────────────────────────────── */

function loadReminders() { try { return JSON.parse(localStorage.getItem(REMINDERS_KEY) || "[]"); } catch { return []; } }
function saveReminders(a) { localStorage.setItem(REMINDERS_KEY, JSON.stringify(a)); }

function renderReminders() {
  const head = pageHead("Reminders", "Things to remember.");
  const panel = document.createElement("div"); panel.className = "panel";
  panel.innerHTML = `
    <form class="reminder-form" id="reminder-form">
      <input type="text" id="r-input" placeholder="Add a reminder…" required />
      <input type="date" id="r-date" />
      <button type="submit">Add</button>
    </form>
    <ul class="reminder-list" id="r-list"></ul>
    <div class="empty hidden" id="r-empty"><strong>No reminders yet.</strong>Add one above.</div>
  `;
  main.replaceChildren(head, panel);

  const form = document.getElementById("reminder-form");
  const input = document.getElementById("r-input");
  const dateIn = document.getElementById("r-date");
  const list = document.getElementById("r-list");
  const empty = document.getElementById("r-empty");
  const isOver = (iso) => { if (!iso) return false; const t = new Date(); t.setHours(0,0,0,0); return new Date(iso + "T00:00:00") < t; };
  const fmt = (iso) => iso ? new Date(iso + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
  function render() {
    const all = loadReminders();
    list.innerHTML = "";
    if (!all.length) { empty.classList.remove("hidden"); return; }
    empty.classList.add("hidden");
    all.sort((a,b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (a.date && b.date) return a.date.localeCompare(b.date);
      if (a.date) return -1; if (b.date) return 1;
      return b.created - a.created;
    });
    for (const r of all) {
      const li = document.createElement("li");
      li.className = "reminder-item" + (r.done ? " done" : "");
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = r.done;
      cb.addEventListener("change", () => {
        const cur = loadReminders(); const t = cur.find(x => x.id === r.id);
        if (t) { t.done = cb.checked; saveReminders(cur); render(); }
      });
      const txt = document.createElement("div"); txt.className = "reminder-text"; txt.textContent = r.text;
      li.appendChild(cb); li.appendChild(txt);
      if (r.date) {
        const d = document.createElement("span");
        d.className = "reminder-date" + (!r.done && isOver(r.date) ? " overdue" : "");
        d.textContent = fmt(r.date);
        li.appendChild(d);
      }
      const del = document.createElement("button"); del.className = "reminder-delete"; del.textContent = "×"; del.title = "Delete";
      del.addEventListener("click", () => { saveReminders(loadReminders().filter(x => x.id !== r.id)); render(); });
      li.appendChild(del);
      list.appendChild(li);
    }
  }
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const t = input.value.trim(); if (!t) return;
    const all = loadReminders();
    all.push({ id: uid(), text: t, date: dateIn.value || null, done: false, created: Date.now() });
    saveReminders(all);
    input.value = ""; dateIn.value = ""; render(); input.focus();
  });
  render();
}

/* ── Studio: library ──────────────────────────────────────────── */

function renderStudioLibrary() {
  const studio = loadStudio();
  const head = pageHead("Studio", "Your books. Keep multiple drafts. Autosaves to this browser.");

  const tools = document.createElement("div"); tools.className = "lib-toolbar";
  const left = document.createElement("div");
  const newBtn = document.createElement("button"); newBtn.className = "btn-primary";
  newBtn.innerHTML = `<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 2v10M2 7h10"/></svg> New Book`;
  newBtn.addEventListener("click", () => {
    const title = prompt("Book title?", "Untitled"); if (title === null) return;
    const author = prompt("Author?", "Arjun") || "";
    const b = newBook(title.trim() || "Untitled", author.trim());
    studio.books[b.id] = b; studio.activeBookId = b.id;
    saveStudio(studio); openStudio(b.id);
  });
  left.appendChild(newBtn);
  tools.appendChild(left);

  main.replaceChildren(head, tools);

  const books = Object.values(studio.books).sort((a, b) => b.updatedAt - a.updatedAt);
  if (!books.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.innerHTML = `<strong>No books yet</strong>Click "New Book" to start.`;
    main.appendChild(e);
    return;
  }
  const grid = document.createElement("div"); grid.className = "book-grid";
  for (const b of books) grid.appendChild(bookCard(b));
  main.appendChild(grid);
}
function bookCard(book) {
  const wc = bookWordCount(book);
  const wrap = document.createElement("button"); wrap.className = "book-card";
  wrap.innerHTML = `
    <div class="book-cover-thumb" style="background:${coverGradient(book.cover.color)}">
      <div></div>
      <div>
        <div class="cv-title">${escapeHtml(book.title)}</div>
        <div class="cv-author">${escapeHtml(book.author || "")}</div>
      </div>
    </div>
    <div class="book-meta">
      <p class="bm-title">${escapeHtml(book.title)}</p>
      <p class="bm-sub">${wc.toLocaleString()} words · edited ${relTime(book.updatedAt)}</p>
    </div>
  `;
  wrap.addEventListener("click", () => openStudio(book.id));
  return wrap;
}
function relTime(ts) {
  const d = (Date.now() - ts) / 1000;
  if (d < 60) return "just now";
  if (d < 3600) return Math.round(d / 60) + "m ago";
  if (d < 86400) return Math.round(d / 3600) + "h ago";
  if (d < 604800) return Math.round(d / 86400) + "d ago";
  return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

/* ── Studio: editor ───────────────────────────────────────────── */

let activeBookId = null;
let activeSectionId = null;
let saveTimer = null;
let outlineCollapsed = false;

function openStudio(bookId) {
  const studio = loadStudio();
  if (!studio.books[bookId]) return;
  activeBookId = bookId;
  activeSectionId = studio.books[bookId].activeSectionId || studio.books[bookId].sections[0].id;
  studio.activeBookId = bookId;
  saveStudio(studio);
  renderStudioEditor();
}
function closeStudio() {
  if (!activeBookId) return;
  flushSave();
  studioMount.innerHTML = "";
  activeBookId = null;
  activeSectionId = null;
}

function renderStudioEditor() {
  const studio = loadStudio();
  const book = studio.books[activeBookId]; if (!book) return;
  const sec = book.sections.find(s => s.id === activeSectionId) || book.sections[0];
  activeSectionId = sec.id;

  const view = document.createElement("div"); view.className = "studio-view";

  // Bar
  const bar = document.createElement("div"); bar.className = "studio-bar";
  bar.innerHTML = `
    <button class="icon-btn" id="st-back" title="Back to Library">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3l-5 5 5 5"/></svg>
    </button>
    <button class="icon-btn" id="st-outline" title="Toggle outline">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h10"/></svg>
    </button>
    <span class="sb-title" id="st-title-disp">${escapeHtml(book.title)}</span>
    <span class="sb-spacer"></span>
    <span class="sb-meta" id="st-status">Saved</span>
    <span class="sb-meta" id="st-words"></span>
  `;

  // Body
  const body = document.createElement("div"); body.className = "studio-body" + (outlineCollapsed ? " outline-collapsed" : "");
  const outline = document.createElement("div"); outline.className = "outline"; outline.id = "st-outline-pane";
  const editor  = document.createElement("div"); editor.className  = "editor-pane";
  body.appendChild(outline); body.appendChild(editor);

  view.appendChild(bar); view.appendChild(body);
  studioMount.replaceChildren(view);

  // Wire up bar
  document.getElementById("st-back").addEventListener("click", () => {
    closeStudio();
    navigate("studio");
  });
  document.getElementById("st-outline").addEventListener("click", () => {
    outlineCollapsed = !outlineCollapsed;
    body.classList.toggle("outline-collapsed", outlineCollapsed);
  });

  renderOutline(book);
  renderSectionEditor(book, sec);
  updateWordCount();
}

function renderOutline(book) {
  const pane = document.getElementById("st-outline-pane"); if (!pane) return;
  pane.innerHTML = "";

  const groups = [
    { id: "front", label: "Front Matter", sections: [], optionalTypes: FRONT_OPTIONAL },
    { id: "body",  label: "Manuscript",   sections: [], canAddChapter: true },
    { id: "back",  label: "Back Matter",  sections: [], optionalTypes: BACK_OPTIONAL },
  ];
  for (const s of book.sections) {
    const meta = SECTION_TYPES[s.type];
    if (!meta) { groups[1].sections.push(s); continue; }
    const g = groups.find(x => x.id === meta.group); if (g) g.sections.push(s);
  }

  for (const g of groups) {
    const lab = document.createElement("div"); lab.className = "outline-group-label";
    lab.appendChild(textNode(g.label));
    if (g.canAddChapter || g.optionalTypes) {
      const add = document.createElement("button"); add.className = "add-mini"; add.textContent = "+"; add.title = "Add";
      add.addEventListener("click", (e) => { e.stopPropagation(); openAddMenu(add, g, book); });
      lab.appendChild(add);
    }
    pane.appendChild(lab);
    for (const s of g.sections) pane.appendChild(outlineRow(book, s));
  }
}
function textNode(t) { return document.createTextNode(t); }

function outlineRow(book, sec) {
  const row = document.createElement("div");
  row.className = "outline-row" + (sec.id === activeSectionId ? " active" : "");
  const wc = sectionWordCount(sec);
  row.innerHTML = `
    <span class="or-title"></span>
    ${wc ? `<span class="or-words">${wc}</span>` : ""}
    <span class="or-actions">
      <button data-act="rename" title="Rename"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5L8.5 2l1.5 1.5L3.5 10H2v-1.5z"/></svg></button>
      <button data-act="up"     title="Move up"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l3-3 3 3"/></svg></button>
      <button data-act="down"   title="Move down"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5l3 3 3-3"/></svg></button>
      <button data-act="delete" title="Delete"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h8M4 4V2.5h4V4M4.5 4v5M7.5 4v5M3 4l.5 6h5L9 4"/></svg></button>
    </span>
  `;
  row.querySelector(".or-title").textContent = sec.title;
  row.addEventListener("click", () => {
    if (activeSectionId === sec.id) return;
    flushSave();
    activeSectionId = sec.id;
    const studio = loadStudio();
    studio.books[book.id].activeSectionId = sec.id;
    saveStudio(studio);
    renderOutline(book);
    renderSectionEditor(book, sec);
    updateWordCount();
  });
  row.querySelectorAll(".or-actions button").forEach(b => {
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      const act = b.dataset.act;
      if (act === "rename") inlineRename(row, sec, book);
      else if (act === "up")   moveSection(book, sec, -1);
      else if (act === "down") moveSection(book, sec, +1);
      else if (act === "delete") deleteSection(book, sec);
    });
  });
  return row;
}
function inlineRename(row, sec, book) {
  const titleSpan = row.querySelector(".or-title");
  const input = document.createElement("input");
  input.className = "or-rename-input"; input.value = sec.title;
  titleSpan.replaceWith(input); input.focus(); input.select();
  function commit(save) {
    if (save) {
      const v = input.value.trim();
      if (v) {
        sec.title = v;
        const studio = loadStudio();
        studio.books[book.id].sections.find(x => x.id === sec.id).title = v;
        studio.books[book.id].updatedAt = Date.now();
        saveStudio(studio);
        if (sec.id === activeSectionId) {
          const eyebrow = document.querySelector(".editor-eyebrow");
          if (eyebrow) eyebrow.textContent = SECTION_TYPES[sec.type]?.label || "Section";
          const heading = document.querySelector(".editor-heading");
          if (heading) heading.value = v;
        }
      }
    }
    renderOutline(book);
  }
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") commit(true);
    if (e.key === "Escape") commit(false);
  });
  input.addEventListener("blur", () => commit(true));
}
function moveSection(book, sec, dir) {
  const studio = loadStudio();
  const arr = studio.books[book.id].sections;
  const i = arr.findIndex(x => x.id === sec.id);
  // restrict moves to within the same group
  const group = SECTION_TYPES[sec.type]?.group;
  let j = i + dir;
  while (j >= 0 && j < arr.length && SECTION_TYPES[arr[j].type]?.group !== group) j += dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  studio.books[book.id].updatedAt = Date.now();
  saveStudio(studio);
  renderOutline(studio.books[book.id]);
}
function deleteSection(book, sec) {
  if (sec.type === "cover" || sec.type === "title-page") {
    alert("Can't delete cover or title page."); return;
  }
  if (!confirm(`Delete "${sec.title}"? This can't be undone.`)) return;
  const studio = loadStudio();
  const arr = studio.books[book.id].sections;
  const i = arr.findIndex(x => x.id === sec.id);
  arr.splice(i, 1);
  if (activeSectionId === sec.id) activeSectionId = arr[Math.max(0, i - 1)].id;
  studio.books[book.id].activeSectionId = activeSectionId;
  studio.books[book.id].updatedAt = Date.now();
  saveStudio(studio);
  renderOutline(studio.books[book.id]);
  const newActive = arr.find(x => x.id === activeSectionId);
  renderSectionEditor(studio.books[book.id], newActive);
  updateWordCount();
}
function openAddMenu(anchor, group, book) {
  // simple prompt-based add (minimal UI)
  if (group.canAddChapter) {
    const ch = book.sections.filter(s => s.type === "chapter").length;
    const sec = { id: uid(), type: "chapter", title: `Chapter ${ch + 1}`, content: "" };
    insertSectionAtEndOfGroup(book, sec, "body");
    return;
  }
  // optional front/back items
  const types = group.optionalTypes;
  const present = new Set(book.sections.map(s => s.type));
  const opts = types.filter(t => !present.has(t) || t === "custom");
  if (!opts.length) { alert("All " + group.label.toLowerCase() + " sections already added."); return; }
  const labels = opts.map(t => SECTION_TYPES[t].label).join("\n  ");
  const pick = prompt("Add which section?\n  " + labels, SECTION_TYPES[opts[0]].label);
  if (!pick) return;
  const t = opts.find(x => SECTION_TYPES[x].label.toLowerCase() === pick.trim().toLowerCase());
  if (!t) { alert("Couldn't match that. Try one of: " + labels); return; }
  const sec = { id: uid(), type: t, title: SECTION_TYPES[t].label, content: "" };
  insertSectionAtEndOfGroup(book, sec, group.id);
}
function insertSectionAtEndOfGroup(book, sec, groupId) {
  const studio = loadStudio();
  const arr = studio.books[book.id].sections;
  // find last index in this group
  let insertAt = arr.length;
  for (let i = arr.length - 1; i >= 0; i--) {
    if (SECTION_TYPES[arr[i].type]?.group === groupId) { insertAt = i + 1; break; }
    if (groupId === "body" && SECTION_TYPES[arr[i].type]?.group === "front") { insertAt = i + 1; break; }
  }
  arr.splice(insertAt, 0, sec);
  studio.books[book.id].updatedAt = Date.now();
  studio.books[book.id].activeSectionId = sec.id;
  saveStudio(studio);
  activeSectionId = sec.id;
  renderOutline(studio.books[book.id]);
  renderSectionEditor(studio.books[book.id], sec);
  updateWordCount();
}

function renderSectionEditor(book, sec) {
  const pane = document.querySelector(".editor-pane"); if (!pane) return;

  if (sec.type === "cover") return renderCoverEditor(book, pane);

  const meta = SECTION_TYPES[sec.type] || { label: "Section" };
  const shell = document.createElement("div"); shell.className = "editor-shell";
  const isTitlePage = sec.type === "title-page";
  shell.innerHTML = `
    <div class="editor-eyebrow">${escapeHtml(meta.label)}</div>
    <input type="text" class="editor-heading" value="${escapeAttr(sec.title)}" />
    <div class="editor-toolbar">
      <button data-cmd="bold"    title="Bold"><b>B</b></button>
      <button data-cmd="italic"  title="Italic"><i>I</i></button>
      <span class="sep"></span>
      <button data-cmd="h2"      title="Scene heading">H</button>
      <button data-cmd="quote"   title="Block quote">”</button>
      <button data-cmd="hr"      title="Scene break">— —</button>
      <span class="sep"></span>
      <button data-cmd="ul"      title="Bulleted list">•</button>
      <button data-cmd="ol"      title="Numbered list">1.</button>
    </div>
    <div class="editor-content" id="ed-content" contenteditable="true"></div>
  `;
  pane.replaceChildren(shell);

  const content = document.getElementById("ed-content");
  if (sec.content && sec.content.trim()) {
    content.innerHTML = sec.content;
  } else {
    content.innerHTML = "<p></p>";
    placeCaretAtEnd(content);
  }

  // toolbar
  shell.querySelectorAll(".editor-toolbar button").forEach(b => {
    b.addEventListener("mousedown", (e) => e.preventDefault());   // keep selection
    b.addEventListener("click", () => {
      const cmd = b.dataset.cmd;
      content.focus();
      if (cmd === "bold")     document.execCommand("bold");
      else if (cmd === "italic") document.execCommand("italic");
      else if (cmd === "h2")  document.execCommand("formatBlock", false, "H2");
      else if (cmd === "quote") document.execCommand("formatBlock", false, "BLOCKQUOTE");
      else if (cmd === "hr")  document.execCommand("insertHorizontalRule");
      else if (cmd === "ul")  document.execCommand("insertUnorderedList");
      else if (cmd === "ol")  document.execCommand("insertOrderedList");
      scheduleSave();
    });
  });

  // typing
  content.addEventListener("input", scheduleSave);

  // heading
  const heading = shell.querySelector(".editor-heading");
  heading.addEventListener("input", () => {
    sec.title = heading.value || meta.label;
    scheduleSave(/*titleOnly*/ true);
  });
  if (isTitlePage && (!sec.content || !sec.content.trim())) {
    // helpful default for the title page
    content.innerHTML = `<p style="text-align:center;font-size:1.3em;font-weight:600;">${escapeHtml(book.title)}</p><p style="text-align:center;">${escapeHtml(book.author || "")}</p>`;
    persistContent(content);
  }
}

function renderCoverEditor(book, pane) {
  const shell = document.createElement("div"); shell.className = "editor-shell";
  shell.innerHTML = `
    <div class="editor-eyebrow">Cover</div>
    <h1 class="editor-heading" style="margin-bottom:6px;">Cover &amp; Metadata</h1>
    <p style="color:var(--muted);font-size:13.5px;margin:0 0 22px;">Pick a color and edit the title and author. Used in the library and on the title page.</p>
    <div class="cover-editor">
      <div class="cover-preview" id="cv-prev" style="background:${coverGradient(book.cover.color)}">
        <div></div>
        <div>
          <div class="cp-title" id="cv-prev-title"></div>
          <div class="cp-author" id="cv-prev-author"></div>
        </div>
      </div>
      <div class="cover-form">
        <div class="field">
          <label for="cv-title">Title</label>
          <input id="cv-title" type="text" value="${escapeAttr(book.title)}" />
        </div>
        <div class="field">
          <label for="cv-author">Author</label>
          <input id="cv-author" type="text" value="${escapeAttr(book.author || '')}" />
        </div>
        <div class="field">
          <label>Color</label>
          <div class="swatches" id="cv-swatches"></div>
        </div>
      </div>
    </div>
  `;
  pane.replaceChildren(shell);

  const titleEl = document.getElementById("cv-title");
  const authorEl = document.getElementById("cv-author");
  const prevTitle = document.getElementById("cv-prev-title");
  const prevAuthor = document.getElementById("cv-prev-author");
  const prev = document.getElementById("cv-prev");
  const swatches = document.getElementById("cv-swatches");

  prevTitle.textContent = book.title;
  prevAuthor.textContent = book.author || "";

  for (const p of COVER_PALETTE) {
    const s = document.createElement("button");
    s.className = "swatch" + (book.cover.color === p.id ? " selected" : "");
    s.style.background = p.bg;
    s.title = p.id;
    s.addEventListener("click", () => {
      book.cover.color = p.id;
      prev.style.background = p.bg;
      swatches.querySelectorAll(".swatch").forEach(x => x.classList.remove("selected"));
      s.classList.add("selected");
      persistBookMeta(book);
    });
    swatches.appendChild(s);
  }
  titleEl.addEventListener("input", () => {
    book.title = titleEl.value || "Untitled";
    prevTitle.textContent = book.title;
    document.getElementById("st-title-disp").textContent = book.title;
    persistBookMeta(book);
  });
  authorEl.addEventListener("input", () => {
    book.author = authorEl.value;
    prevAuthor.textContent = book.author || "";
    persistBookMeta(book);
  });
}

function persistBookMeta(book) {
  const studio = loadStudio();
  const b = studio.books[book.id]; if (!b) return;
  b.title = book.title; b.author = book.author; b.cover = book.cover;
  b.updatedAt = Date.now();
  saveStudio(studio);
  setStatus("Saved");
}

function persistContent(content) {
  const studio = loadStudio();
  const b = studio.books[activeBookId]; if (!b) return;
  const sec = b.sections.find(s => s.id === activeSectionId); if (!sec) return;
  sec.content = content.innerHTML;
  b.updatedAt = Date.now();
  saveStudio(studio);
  setStatus("Saved");
  updateWordCount();
  // refresh the row's word count quietly
  renderOutline(b);
}

function scheduleSave(titleOnly) {
  setStatus("Saving…");
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveTimer = null;
    if (titleOnly) {
      const studio = loadStudio();
      const b = studio.books[activeBookId];
      const s = b?.sections.find(x => x.id === activeSectionId);
      if (s) {
        const heading = document.querySelector(".editor-heading");
        s.title = heading ? heading.value : s.title;
        b.updatedAt = Date.now();
        saveStudio(studio);
        renderOutline(b);
      }
      setStatus("Saved");
    } else {
      const c = document.getElementById("ed-content");
      if (c) persistContent(c);
    }
  }, 500);
}
function flushSave() {
  if (saveTimer) {
    clearTimeout(saveTimer); saveTimer = null;
    const c = document.getElementById("ed-content");
    if (c) persistContent(c);
  }
}
function setStatus(text) {
  const el = document.getElementById("st-status");
  if (el) el.textContent = text;
}
function updateWordCount() {
  const studio = loadStudio();
  const b = studio.books[activeBookId]; if (!b) return;
  const w = bookWordCount(b);
  const el = document.getElementById("st-words");
  if (el) el.textContent = w.toLocaleString() + " words";
}
function placeCaretAtEnd(el) {
  el.focus();
  const range = document.createRange();
  range.selectNodeContents(el); range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
}

/* ── Helpers ──────────────────────────────────────────────────── */

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }
</script>
